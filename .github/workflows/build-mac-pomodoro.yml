name: Build Pomodoro Logs macOS
on:
  push:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to package for manual runs
        type: choice
        options:
          - x64
          - arm64
          - both
        default: x64
permissions:
  contents: read
jobs:
  bundle:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'push' && fromJSON('["arm64", "x64"]') || (inputs.architecture == 'both' && fromJSON('["arm64", "x64"]') || fromJSON(format('["{0}"]', inputs.architecture))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - name: Package macOS app (unsigned by default)
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-logs-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
